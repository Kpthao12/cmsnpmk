<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>happy birthday 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Be+Vietnam+Pro:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec;
    --ink:#2f2925;
    --pink:#eea8a1;
    --pink-dark:#d98a83;
    --cream:#fffaf1;
    --card-w:min(86vw, 520px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg);
    font-family:'Patrick Hand', 'Be Vietnam Pro', cursive;
    color:var(--ink);
    user-select:none;
  }

  /* ---------- stars ---------- */
  #stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .star{position:absolute;animation:twinkle var(--d) ease-in-out infinite alternate}
  @keyframes twinkle{
    from{transform:rotate(var(--r)) scale(1)}
    to{transform:rotate(calc(var(--r) + 14deg)) scale(.86)}
  }

  /* ---------- screens ---------- */
  .screen{
    position:fixed;inset:0;z-index:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(14px,3vh,26px);padding:24px;
    opacity:0;visibility:hidden;transform:scale(.97);
    transition:opacity .6s ease, transform .6s ease, visibility 0s .6s;
  }
  .screen.active{opacity:1;visibility:visible;transform:none;transition:opacity .6s ease, transform .6s ease}

  .big{
    font-size:clamp(30px,8.5vw,56px);letter-spacing:.06em;text-align:center;
    min-height:1.3em;line-height:1.25;max-width:min(92vw,720px);
  }
  .caret::after{content:'';display:inline-block;width:.06em;height:.9em;margin-left:.08em;
    background:var(--ink);vertical-align:-.08em;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .btn{
    font-family:inherit;font-size:clamp(17px,4.4vw,22px);letter-spacing:.04em;
    background:var(--cream);color:var(--ink);
    border:1.6px solid var(--ink);border-radius:999px;
    padding:.18em 1.1em .22em;cursor:pointer;
    box-shadow:0 2px 0 var(--ink);
    transition:transform .15s, box-shadow .15s, opacity .5s;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
  .btn.hidden{opacity:0;pointer-events:none}
  .row{display:flex;align-items:flex-end;gap:clamp(10px,5vw,40px)}

  .mascot{width:clamp(84px,22vw,120px);animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}

  /* "no thanks" runs away */
  #t2{font-family:'Be Vietnam Pro',sans-serif;font-size:clamp(22px,5.6vw,38px);letter-spacing:.02em;line-height:1.45}
  .card .msg,.letter p{font-family:'Be Vietnam Pro',sans-serif;letter-spacing:.01em}
  #noBtn{position:relative;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}

  /* ---------- pink card ---------- */
  .card-wrap{position:relative;width:var(--card-w);margin-top:90px}
  .peek{
    position:absolute;left:50%;top:0;width:clamp(96px,26vw,130px);
    transform:translate(-50%,-80%);z-index:0;
  }
  .card{
    position:relative;z-index:1;
    background:var(--pink);border:2px solid var(--ink);border-radius:28px;
    box-shadow:5px 6px 0 rgba(47,41,37,.15);
    aspect-ratio:1.45/1;padding:clamp(18px,5vw,30px);
    display:flex;flex-direction:column;align-items:center;
  }
  .card .msg{font-size:clamp(18px,4.8vw,26px);letter-spacing:.05em;align-self:flex-start;min-height:1.3em;line-height:1.3}

  #cake{width:clamp(110px,32vw,170px);margin-top:auto;cursor:pointer;transition:transform .2s}
  #cake:hover{transform:scale(1.05)}
  #cake .rays line{animation:rays 1.2s ease-in-out infinite alternate}
  #cake .flame{transform-origin:60px 40px;animation:flick .25s ease-in-out infinite alternate}
  @keyframes rays{from{opacity:.25}to{opacity:1}}
  @keyframes flick{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.9,1.12) rotate(4deg)}}
  #cake.out .flame,#cake.out .rays{opacity:0;transition:opacity .3s}
  .puff{position:absolute;font-size:22px;opacity:0;animation:puff 1.1s ease-out forwards}
  @keyframes puff{0%{opacity:.8;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-50px) scale(1.4)}}

  #plush{width:clamp(110px,32vw,165px);margin:auto 0 0;animation:pop .7s cubic-bezier(.3,1.7,.5,1) both}
  @keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
  #plush svg{animation:wiggle 2s ease-in-out .8s infinite}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
  .card .btn{position:absolute;bottom:0;left:50%;transform:translate(-50%,50%)}
  .card .btn:active{transform:translate(-50%,calc(50% + 2px))}

  /* ---------- letter ---------- */
  .letter-wrap{position:relative;width:min(90vw,760px)}
  .letter{
    background:var(--pink);border:2px solid var(--ink);border-radius:30px;
    box-shadow:5px 6px 0 rgba(47,41,37,.15);
    padding:clamp(40px,6vw,56px) clamp(26px,13vw,150px) clamp(90px,12vw,120px);
    min-height:min(60vh,420px);
    display:flex;align-items:flex-start;justify-content:center;
  }
  .letter p{
    font-size:clamp(14.5px,2.4vw,19px);line-height:1.6;
    white-space:pre-wrap;min-height:6em;width:100%;max-height:72vh;overflow-y:auto;
  }
  .photo{
    position:absolute;width:clamp(92px,24vw,150px);aspect-ratio:1;border-radius:50%;
    border:3px solid var(--cream);outline:2px solid var(--ink);
    background:#f7d9d4 center/cover no-repeat;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    animation:pop .7s cubic-bezier(.3,1.7,.5,1) both;
  }
  .photo .ph{font-size:13px;text-align:center;line-height:1.2;color:#8a5f59;padding:8px}
  .p1{left:-4%;top:-10%;animation-delay:.2s}
  .p2{right:-3%;bottom:-10%;animation-delay:.5s}
  .deco{position:absolute;animation:pop .7s cubic-bezier(.3,1.7,.5,1) both}
  .d-cake{left:-5%;bottom:-12%;width:clamp(90px,22vw,150px);animation-delay:.8s}
  .d-flowers{right:-4%;top:-14%;width:clamp(84px,20vw,140px);animation-delay:1.1s}
  .d-cake svg,.d-flowers svg{animation:bob 2.6s ease-in-out infinite}
  .flip svg{transform:scaleX(-1);animation:bobFlip 2.6s ease-in-out infinite}
  @keyframes bobFlip{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-6px) rotate(3deg)}}
  .d-balloons{left:-3%;top:-16%;width:clamp(80px,18vw,120px);animation-delay:.2s}
  .d-gift{right:-2%;bottom:-10%;width:clamp(70px,15vw,105px);animation-delay:.5s}
  .d-balloons svg{animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
  .d-gift svg{animation:bob 2.2s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

  @media (max-aspect-ratio: 3/4){
    .letter{padding:clamp(80px,22vw,110px) 22px clamp(120px,32vw,150px);min-height:62vh}
    .p1{left:-2%;top:-6%}.p2{right:-2%;bottom:-6%}
    .d-cake{left:-3%;bottom:-6%}.d-flowers{right:-2%;top:-7%}
    .d-balloons{left:-2%;top:-8%}.d-gift{right:-1%;bottom:-5%}
  }

  .replay{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:3;font-size:16px}
  .replay:active{transform:translate(-50%,2px)}

  /* ---------- confetti ---------- */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  .confetti{
    position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;
    animation:fall var(--t) cubic-bezier(.25,.6,.4,1) forwards;
  }
  @keyframes fall{
    to{transform:translate(var(--drift), 110vh) rotate(var(--spin));opacity:.9}
  }
</style>
</head>

<script>
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ordinal = n => { const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };

function typeText(el, text, speed = 75){
  return new Promise(async res => {
    el.textContent = ''; el.classList.add('caret');
    for (const ch of [...text]){
      el.textContent += ch;
      await sleep(/[,.!?\n]/.test(ch) ? speed*4 : speed);
    }
    await sleep(350); el.classList.remove('caret'); res();
  });
}

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

/* ---------- stars ---------- */
(function makeStars(){
  const colors = ['#e8574f','#6fb7e0','#f2c14e','#f0a050','#a8c96a','#8fd0e8'];
  const box = $('stars');
  const n = Math.round(Math.min(40, (innerWidth*innerHeight)/18000) + 10);
  for (let i=0;i<n;i++){
    const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 24 24'); s.classList.add('star');
    const size = 14 + Math.random()*16;
    Object.assign(s.style,{left:Math.random()*100+'%',top:Math.random()*100+'%',width:size+'px',height:size+'px'});
    s.style.setProperty('--r', (Math.random()*70)+'deg');
    s.style.setProperty('--d', (2+Math.random()*3)+'s');
    s.innerHTML = `<path d="M12 1.5l3 7.2 7.6.6-5.8 5 1.8 7.5L12 17.8 5.4 21.8l1.8-7.5-5.8-5 7.6-.6z" fill="${colors[i%colors.length]}" stroke-linejoin="round"/>`;
    box.appendChild(s);
  }
})();

/* ---------- confetti ---------- */
function launchConfetti(count = 120){
  const colors = ['#e8574f','#6fb7e0','#f2c14e','#f0a050','#a8c96a','#f5b8b0','#c9b6e8'];
  const layer = document.createElement('div'); layer.className = 'confetti-layer';
  for (let i=0;i<count;i++){
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random()*100+'%';
    c.style.background = colors[i%colors.length];
    c.style.setProperty('--t', (2.2+Math.random()*2.2)+'s');
    c.style.setProperty('--drift', (Math.random()*200-100)+'px');
    c.style.setProperty('--spin', (Math.random()*900-450)+'deg');
    c.style.animationDelay = (Math.random()*.6)+'s';
    if (Math.random()<.3){ c.style.borderRadius='50%'; c.style.width=c.style.height='9px'; }
    layer.appendChild(c);
  }
  document.body.appendChild(layer);
  setTimeout(()=>layer.remove(), 5500);
}

/* ---------- photos ---------- */
function addPhoto(cls, src){
  const d = document.createElement('div'); d.className = 'photo '+cls;
  if (src) d.style.backgroundImage = `url("${src}")`;
  else d.innerHTML = '<div class="ph">♡<br>your photo<br>here</div>';
  $('letterWrap').appendChild(d);
}
function addDeco(cls, html){
  const d = document.createElement('div'); d.className = 'deco '+cls; d.innerHTML = html;
  $('letterWrap').appendChild(d);
}

/* ---------- flow ---------- */
async function start(){
  await document.fonts.ready;
  const greet = 'HAPPI BDAY PMK!!!';
  await sleep(500);
  await typeText($('t1'), greet, 95);
  $('next1').classList.remove('hidden');
}

$('next1').onclick = async () => {
  show('s2'); await sleep(500);
  await typeText($('t2'), 'Nhân dịp SN Khánh hum nay, Thảo có món quà nho nhỏ tặng Khánh:D', 60);
  $('yesBtn').classList.remove('hidden'); $('noBtn').classList.remove('hidden');
};

/* "no thanks" dodges away */
let dodges = 0;
const dodge = e => {
  e.preventDefault();
  dodges++;
  const x = (Math.random()*2-1) * Math.min(140, innerWidth*.3);
  const y = -(40 + Math.random()*120);
  $('noBtn').style.transform = `translate(${x}px, ${y}px) rotate(${x/8}deg)`;
  if (dodges === 3) $('noBtn').textContent = 'nope :p';
  if (dodges >= 5){ $('noBtn').textContent = 'yes!!'; $('noBtn').onclick = goCake; }
};
$('noBtn').addEventListener('mouseenter', dodge);
$('noBtn').addEventListener('touchstart', e => { if (dodges < 5) dodge(e); }, {passive:false});
$('noBtn').addEventListener('click', e => { if (dodges < 5) dodge(e); });

async function goCake(){
  show('s3'); await sleep(550);
  await typeText($('t3'), 'Ấn vào bánh SN để mở thiệp!', 65);
}
$('yesBtn').onclick = goCake;

let blown = false;
$('cake').onclick = async e => {
  if (blown) return; blown = true;
  $('cake').classList.add('out');
  const r = $('cake').getBoundingClientRect();
  const p = document.createElement('div'); p.className='puff'; p.textContent='💨';
  p.style.left = (r.left + r.width/2 - 11)+'px'; p.style.top = (r.top + r.height*.15)+'px';
  p.style.position='fixed'; document.body.appendChild(p);
  setTimeout(()=>p.remove(), 1200);
  launchConfetti();
  await sleep(1300);
  openLetter();
};

async function openLetter(){
  show('s5'); await sleep(400);
  addDeco('d-balloons', `<svg viewBox="0 0 100 130"><use href="#balloons" width="100" height="130"/></svg>`);
  addDeco('d-flowers flip', `<svg viewBox="0 0 120 150">
      <use href="#bunBody" x="10" y="70" width="100" height="78"/>
      <use href="#bunHead" x="10" y="12" width="100" height="100"/>
      <use href="#hat" x="54" y="0" width="34" height="42" transform="rotate(16 71 21)"/>
      <use href="#miniCake" x="56" y="84" width="58" height="58"/></svg>`);
  addDeco('d-cake', `<svg viewBox="0 0 120 150">
      <use href="#bunBody" x="10" y="70" width="100" height="78"/>
      <use href="#bunHead" x="10" y="12" width="100" height="100"/>
      <use href="#hat" x="54" y="0" width="34" height="42" transform="rotate(16 71 21)"/>
      <use href="#miniCake" x="56" y="84" width="58" height="58"/></svg>`);
  addDeco('d-gift', `<svg viewBox="0 0 100 100"><use href="#gift" width="100" height="100"/></svg>`);
  launchConfetti(80);
  await sleep(1300);
  await typeText($('t5'), CONFIG.message, 28);
  $('replay').classList.remove('hidden');
}

$('replay').onclick = () => location.reload();

start();
</script>
</body>
</html>
